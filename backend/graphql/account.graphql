type User {
    id: Int!
    "The display name: first and last name together."
    name: String!
    email: String!
    username: String
    "A readable account number, e.g. USR-1001."
    user_code: String
    email_verified_at: String
    password_changed_at: String
    last_login_at: String
    created_at: String
    updated_at: String
    profile: UserProfile
}

"The personal details on the Profile page."
type UserProfile {
    first_name: String
    last_name: String
    phone: String
    "male | female (null = not set)"
    gender: String
    date_of_birth: String
    occupation: String
    bio: String
    "IANA time zone name, e.g. Asia/Kathmandu."
    timezone: String
    avatar_url: String
    country: String
    province: String
    city: String
    street_address: String
    postal_code: String
}

"""
What `login` returns: a bearer token for the SPA to store (localStorage) and send as
`Authorization: Bearer <token>` on every request from then on, so the app never has to ask the
server "am I still logged in?" on load — a stale/revoked token is instead caught the moment it's
actually used (the failing request's extensions.status is 401), at which point the SPA clears the
token and sends the user to /login.
"""
type AuthPayload {
    token: String!
    token_type: String!
    user: User!
}

type LoginHistory {
    id: Int!
    ip_address: String
    user_agent: String
    city: String
    region: String
    country: String
    logged_in_at: String
}

"What the account holds and where it has signed in — the Profile page."
type AccountSummary {
    portfolios: Int!
    transactions: Int!
    watchlists: Int!
    watchlist_stocks: Int!
    saved_screens: Int!
    "Signed-in devices: one per live login token."
    active_sessions: Int!
    total_logins: Int!
    "The last five logins, newest first."
    recent_logins: [LoginHistory!]!
}

type EmailLog {
    id: Int!
    status: String!
    mailer: String!
    message_id: String
    from_address: String
    to: [String!]!
    cc: [String!]
    bcc: [String!]
    subject: String
    source: String
    user_id: Int
    error: String
    attempted_at: String
    sent_at: String
    failed_at: String
    created_at: String
    updated_at: String
}

type EmailLogPage {
    data: [EmailLog!]!
    current_page: Int!
    last_page: Int!
    per_page: Int!
    total: Int!
}

extend type Query @guard {
    loginHistory: [LoginHistory!]! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@loginHistory")
    "Counts for the Profile page: portfolios, transactions, watchlists, saved screens, sessions and recent logins."
    accountSummary: AccountSummary! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@accountSummary")
    users: [User!]! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@users")
    "Every email the app tried to send, newest first."
    emailLogs(status: String, per_page: Int = 50): EmailLogPage! @field(resolver: "App\\GraphQL\\Resolvers\\WatchlistResolver@emailLogs")
}

extend type Mutation @guard {
    logout: String! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@logout")
    updateProfile(
        first_name: String, last_name: String, email: String, username: String, phone: String, gender: String,
        date_of_birth: String, occupation: String, bio: String, timezone: String,
        country: String, province: String, city: String, street_address: String, postal_code: String
    ): User! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@updateProfile")
    "Signs out every other device (revokes their login tokens); the current one stays. Returns how many were signed out."
    logoutOtherSessions: Int! @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@logoutOtherSessions")
    updatePassword(current_password: String, password: String, password_confirmation: String): String!
        @field(resolver: "App\\GraphQL\\Resolvers\\AuthResolver@updatePassword")
}
