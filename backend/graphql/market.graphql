type TradeSetup {
    bias: String
    entry_reference: Float
    target: Float
    stop_loss: Float
    risk_per_share: Float
    reward_per_share: Float
    risk_reward_ratio: Float
    attractive: Boolean
}

"One stock's fundamentals (from MeroLagani) with return on equity worked out and the latest price."
type FundamentalRow {
    stock_id: Int!
    symbol: String!
    company_name: String
    sector: String
    close: String
    eps: Float
    eps_fiscal_year: String
    pe_ratio: Float
    book_value: Float
    pbv: Float
    "EPS as a % of book value per share (return on equity); null when either is missing or book value is not positive."
    roe_pct: Float
    market_cap: Float
    one_year_yield_pct: Float
    fetched_at: String
}

"One dividend / bonus declaration: a stock's payout for one fiscal year (Nepali B.S., e.g. 2081/2082), in % of face value."
type MarketDividend {
    stock_id: Int!
    symbol: String!
    company_name: String
    sector: String
    fiscal_year: String!
    bonus_share_pct: Float
    cash_dividend_pct: Float
    total_dividend_pct: Float
    announcement_date: String
    "Free text: the source appends a status such as \"[Closed]\"."
    book_closure_date: String
    distribution_date: String
    bonus_listing_date: String
}

"One row of the Signals page: a stock's latest signal and the percentages behind it."
type SignalBoardRow {
    stock_id: Int!
    symbol: String!
    company_name: String
    sector: String
    close: String
    trade_date: String!
    signal: String!
    "Final BUY % minus SELL %, as -1..1."
    score: Float
    buy_pct: Float
    sell_pct: Float
    hold_pct: Float
    "Why to hold, on a hold day: long_term, consolidation, wait_confirmation, profit_protection, temporary_weakness or overbought."
    hold_type: String
    reasons: [String!]
}

"The trained price-direction model's out-of-sample record against the naive baseline."
type MlModelSummary {
    trained_at: String
    horizon_days: Int
    train_samples: Int
    test_samples: Int
    accuracy: Float
    baseline_accuracy: Float
    beats_baseline: Boolean
    precision: Float
    recall: Float
    f1: Float
    stocks_used: Int
}

"A buy/sell signal with a price target/stop-loss attached."
type ActionableSignal {
    stock_id: Int!
    symbol: String!
    company_name: String
    sector: String
    close: String
    signal: String!
    score: Float
    reasons: [String!]
    trade_setup: TradeSetup
}

"A holding past its stop-loss/target (kind: portfolio) or a watched stock past its alert price (kind: watchlist)."
type PriceAlert {
    kind: String!
    portfolio_id: Int
    portfolio_name: String
    watchlist_id: Int
    watchlist_name: String
    stock_id: Int!
    symbol: String!
    company_name: String
    current_price: Float
    stop_loss: Float
    target_price: Float
    status: String
    alert_price: Float
    alert_direction: String
}

type IndexSnapshot {
    id: Int
    index_name: String!
    trade_date: String!
    close: String
    high: String
    low: String
    previous_close: String
    change: String
    change_pct: String
    fifty_two_week_high: String
    fifty_two_week_low: String
    created_at: String
    updated_at: String
}

type IndexPoint {
    trade_date: String!
    close: Float!
}

type IndexSeries {
    index_name: String!
    latest: IndexSnapshot!
    history: [IndexPoint!]!
}

type SignalAccuracyStat {
    id: Int
    signal_type: String!
    "null = all signals of this type; otherwise the BUY % (buy) / SELL % (sell) band the day fell in, e.g. 60-70."
    confidence_band: String
    horizon_days: Int
    sample_size: Int
    win_rate: String
    avg_forward_return_pct: String
    baseline_win_rate: String
    computed_at: String
    created_at: String
    updated_at: String
}

type SignalAccuracyReport {
    available: Boolean!
    computed_at: String
    horizon_days: Int
    stats: [SignalAccuracyStat!]
    disclaimer: String
}

type FlaggedStock {
    id: Int!
    symbol: String!
    company_name: String
    scrape_error_source: String!
    scrape_error: String
    scrape_error_at: String
}

type DataSourceStatus {
    secret_configured: Boolean!
    flagged_stocks: [FlaggedStock!]!
}

type CandlestickMatch {
    stock_id: Int!
    symbol: String!
    company_name: String
    trade_date: String!
    pattern: String!
    signal: String!
}

type FiftyTwoWeekRow {
    stock_id: Int!
    symbol: String!
    company_name: String
    sector: String
    current_price: Float
    high_52w: Float
    low_52w: Float
    pct_from_high: Float
    pct_from_low: Float
}

type ScrapeLog {
    id: Int!
    source: String!
    status: String!
    records_processed: Int
    message: String
    created_at: String
    updated_at: String
}

"A detected data-quality problem — an invalid OHLC bar, an abnormal price move, missing volume, a stale-date correction, a missing trading date, or a likely-unadjusted corporate action."
type DataQualityFlag {
    id: Int!
    stock_id: Int
    "Null for a market-wide check that isn't about one stock (a missing trading date)."
    stock: StockRef
    trade_date: String
    check_type: String!
    severity: String!
    message: String!
    detected_at: String
    resolved_at: String
}

extend type Query @guard {
    "Every stock's most recent signal (optionally one signal type), highest score first."
    todaySignals(signal: String): [Stock!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@todaySignals")
    "Every stock that has fundamentals, with return on equity — the Fundamental Analysis page."
    fundamentalsBoard: [FundamentalRow!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@fundamentalsBoard")
    "Every dividend / bonus declaration on record, newest fiscal year first — the Market > Dividends page."
    marketDividends: [MarketDividend!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@marketDividends")
    "Every stock's latest signal with its Buy / Sell / Hold % — the Signals page."
    signalBoard: [SignalBoardRow!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@signalBoard")
    "The latest trained direction model's record; null before the first training."
    mlModel: MlModelSummary @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@mlModel")
    "Buy (or sell) signals with a trade setup. bias: buy | sell."
    actionableSignals(bias: String = "buy"): [ActionableSignal!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@actionableSignals")
    signalAccuracy: SignalAccuracyReport! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@signalAccuracy")
    priceAlerts: [PriceAlert!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@priceAlerts")
    indices(days: Int = 90): [IndexSeries!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@indices")
    candlestickPatterns: [CandlestickMatch!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@candlestickPatterns")
    screener: [Stock!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@screener")
    fiftyTwoWeek: [FiftyTwoWeekRow!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@fiftyTwoWeek")
    scrapeLogs(limit: Int = 20): [ScrapeLog!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@scrapeLogs")
    dataSourceStatus: DataSourceStatus! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@dataSourceStatus")
    "Detected data-quality problems, newest first. severity/resolved narrow the list; unresolved by default."
    dataQualityFlags(severity: String, resolved: Boolean = false): [DataQualityFlag!]! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@dataQualityFlags")
}

extend type Mutation @guard {
    "Marks a flag reviewed (dismissed as expected, or acted on) so it stops showing by default."
    resolveDataQualityFlag(id: Int!): DataQualityFlag! @field(resolver: "App\\GraphQL\\Resolvers\\MarketResolver@resolveDataQualityFlag")
}
