<!doctype html><body style="margin:0"><iframe id="f" style="width:1400px;height:900px;border:0"></iframe><script>
localStorage.setItem('auth_token','test-token');localStorage.setItem('auth_user',JSON.stringify({id:1,name:'Tester',email:'t@example.com'}));
const f=document.getElementById('f');const w=ms=>new Promise(r=>setTimeout(r,ms));const out=[];
const PAGES=(new URLSearchParams(location.search).get('p')||'/stocks').split(',');
(async()=>{
 for (const p of PAGES) { f.src=p; await w(3500); const d=f.contentDocument;
  const q=(s)=>d.querySelector(s);
  out.push(p.padEnd(21)
   +' shell='+((q('.topbar')&&q('nav, aside'))?'yes':'NO')
   +' title="'+(q('.page-title')?.textContent.trim()||'')+'"'
   +' topbar-spinner='+(q('.request-indicator')?'yes':'no')
   +' page-loading-line='+d.querySelectorAll('.loading-line').length
   +' notice='+(q('.api-notice')?'yes':'no')
   +' crash-fallback='+(q('.boundary')?'yes':'no')
   +' | '+(q('.api-notice')?.textContent.replace(/\s+/g,' ').trim().slice(0,70)||(q('.boundary')?'(fallback shown)':'')));
 document.body.setAttribute('data-r',out.join(' ## '));
 }
})();
</script></body>
