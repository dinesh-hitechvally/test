name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: I can't see how a stock's dividend yield compares with its sector's average.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      placeholder: Show the sector's average yield next to each stock on the Dividend report.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve it, or workarounds you use now.

  - type: checkboxes
    id: signals
    attributes:
      label: Signals and predictions
      options:
        - label: This changes how a signal, indicator or prediction is calculated (it will need a backtest before it ships).
